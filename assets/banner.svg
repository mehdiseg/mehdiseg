<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mehdi Seghier, étudiant BTS SIO option SISR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.6" stop-color="#141a3d"/>
      <stop offset="1" stop-color="#23206b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 66px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .role { font: 600 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
      .sub  { font: 400 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9aa6c7; }
      .term { font: 400 18px 'Cascadia Mono', Consolas, 'Courier New', monospace; fill: #7dd3c0; }
      .link { stroke: #7c8cff; stroke-opacity: 0.55; stroke-width: 1.6; }
      .node { fill: #0f1533; stroke: url(#accent); stroke-width: 2.2; }
      .core { fill: url(#accent); }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      .p2 { animation-delay: 0.8s; } .p3 { animation-delay: 1.6s; } .p4 { animation-delay: 2.4s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.5); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- Réseau : un petit schéma d'infrastructure -->
  <g transform="translate(790, 0)">
    <line class="link" x1="190" y1="160" x2="70"  y2="70"/>
    <line class="link" x1="190" y1="160" x2="70"  y2="250"/>
    <line class="link" x1="190" y1="160" x2="330" y2="80"/>
    <line class="link" x1="190" y1="160" x2="330" y2="245"/>
    <line class="link" x1="70"  y1="70"  x2="330" y2="80" stroke-dasharray="4 6"/>
    <line class="link" x1="70"  y1="250" x2="330" y2="245" stroke-dasharray="4 6"/>

    <circle class="pulse"    cx="190" cy="160" r="34" fill="#7c8cff" fill-opacity="0.25"/>
    <circle class="node" cx="190" cy="160" r="26"/>
    <circle class="core" cx="190" cy="160" r="9"/>

    <circle class="pulse p2" cx="70"  cy="70"  r="20" fill="#5eead4" fill-opacity="0.25"/>
    <circle class="node" cx="70"  cy="70"  r="15"/>
    <circle class="core" cx="70"  cy="70"  r="5"/>

    <circle class="pulse p3" cx="70"  cy="250" r="20" fill="#5eead4" fill-opacity="0.25"/>
    <circle class="node" cx="70"  cy="250" r="15"/>
    <circle class="core" cx="70"  cy="250" r="5"/>

    <circle class="pulse p4" cx="330" cy="80"  r="20" fill="#818cf8" fill-opacity="0.25"/>
    <circle class="node" cx="330" cy="80"  r="15"/>
    <circle class="core" cx="330" cy="80"  r="5"/>

    <circle class="pulse p2" cx="330" cy="245" r="20" fill="#818cf8" fill-opacity="0.25"/>
    <circle class="node" cx="330" cy="245" r="15"/>
    <circle class="core" cx="330" cy="245" r="5"/>
  </g>

  <text class="name" x="64" y="130">Mehdi Seghier</text>
  <text class="role" x="66" y="176">Étudiant BTS SIO · option SISR</text>
  <text class="sub"  x="66" y="212">Systèmes, réseaux et un peu de web</text>
  <text class="term" x="66" y="268">$ ping mehdiseg.github.io<tspan class="cursor"> ▌</tspan></text>
</svg>
